<svg xmlns="http://www.w3.org/2000/svg" width="260" height="56" viewBox="0 0 260 56" role="img" aria-label="Download Zycord">
  <title>Download Zycord</title>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57b8a2"/>
      <stop offset="1" stop-color="#2f7d6d"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="260" height="56" rx="14"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="260" height="56" rx="14" fill="url(#face)"/>

  <!-- A highlight sweeping across the face, the only motion. -->
  <g clip-path="url(#clip)">
    <rect x="-90" y="0" width="70" height="56" fill="url(#sheen)">
      <animate attributeName="x" values="-90;280" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="259" height="55" rx="13.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.18"/>

  <!-- Arrow into a tray, bobbing gently. -->
  <g fill="none" stroke="#04120e" stroke-width="2.4"
     stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate"
                      values="30 26.5;30 30;30 26.5" dur="1.8s" repeatCount="indefinite"/>
    <path d="M0 -9 V5"/>
    <path d="M-5.5 -0.5 L0 5 L5.5 -0.5"/>
    <path d="M-8.5 9 H8.5" stroke-opacity="0.55"/>
  </g>

  <text x="52" y="34" fill="#04120e" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="700" letter-spacing="0.1">Download</text>
</svg>
