name: Build release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, self test and pack
        run: python build.py

      - name: Show checksum
        run: type SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Zycord-1.1.4
          path: |
            Zycord-1.1.4.zip
            SHA256.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          Zycord-1.1.4.zip SHA256.txt
          --title "Zycord ${{ github.ref_name }}"
          --notes-file CHANGELOG.md
          --verify-tag
