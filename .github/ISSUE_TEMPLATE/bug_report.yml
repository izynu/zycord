name: Bug report
description: Report something that does not work in Zycord.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Before you continue, check the FAQ and the troubleshooting section of the documentation:
        https://izynu.github.io/zycord/faq.html
        https://izynu.github.io/zycord/docs.html

        Do not use this form for a security problem. Report those privately as described in SECURITY.md.

  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: A clear description of the problem.
      placeholder: I started a session for the game, and the Sessions tab kept showing it after the process had exited.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that lead to the problem.
      placeholder: |
        1. Open the Games tab.
        2. Search for the game.
        3. Start a session with the default executable.
        4. ...
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Run `winver` and copy the version and build number. Include the edition if you know it.
      placeholder: Windows 11 Home, version 24H2, build 26100.1742
    validations:
      required: true

  - type: input
    id: zycord-version
    attributes:
      label: Zycord version
      description: The version shown on the About tab, or the output of `Zycord.exe --version`.
      placeholder: 1.1.2
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game
      description: The game you were starting a session for. The exact name as it appears in Zycord, if you can.
      placeholder: Cyberpunk 2077
    validations:
      required: true

  - type: dropdown
    id: quest-type
    attributes:
      label: Quest type
      description: The quest you were trying to complete.
      options:
        - Play on desktop (PLAY_ON_DESKTOP)
        - Watch a video (WATCH_VIDEO)
        - Play an activity (PLAY_ACTIVITY)
        - Another type
        - Not sure
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        Open the Logs tab, or the log file in %LOCALAPPDATA%\Zycord\logs, and paste the lines around the problem.
        Remove anything you consider private first. The log does not contain your Discord account or token.
      renderer: text
      placeholder: |
        2026-11-05 14:31:07.412 INFO  session started app=1091500 pid=18244 exe=bin/x64/Cyberpunk2077.exe
        2026-11-05 14:31:09.008 WARN  refusing to stop pid 18244: it is no longer the Zycord stub
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What you thought would happen instead.
      placeholder: The session should disappear from the list once the process has exited.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am running the current release, or a build from the current source.
          required: true
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: This is not a security report.
          required: true
        - label: I have removed anything private from the log excerpt.
          required: true
